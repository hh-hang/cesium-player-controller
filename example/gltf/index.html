<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glTF · cesium-player-controller</title>
    <link rel="stylesheet" href="../styles/common.css" />
</head>
<body>
    <div id="cesiumContainer"></div>

    <div class="model-credit" role="note" aria-label="Character model attribution">
        <span class="credit-row">
            Character Model:
            <a href="https://quaternius.itch.io/universal-animation-library" target="_blank" rel="noopener noreferrer">
                Universal Animation Library
            </a>
        </span>
        <span class="credit-row">
            glTF Model:
            <a href="https://sketchfab.com/3d-models/city-scene-tokyo-b25d23ff186949dca3df669c14447db5" target="_blank" rel="noopener noreferrer">
                city_scene_tokyo
            </a>
        </span>
    </div>

    <div class="hud" role="note" aria-label="Controls">
        <div class="hint-move">
            <div class="hint-cluster">
                <div class="wasd">
                    <kbd class="wasd-w">W</kbd>
                    <kbd class="wasd-a">A</kbd>
                    <kbd class="wasd-s">S</kbd>
                    <kbd class="wasd-d">D</kbd>
                </div>
                <span class="hint-text">Move</span>
            </div>
            <div class="hint-cluster">
                <div class="hint-mouse" aria-hidden="true">
                    <div class="hint-mouse-body">
                        <span class="hint-mouse-wheel"></span>
                        <span class="hint-mouse-nub"></span>
                    </div>
                </div>
                <span class="hint-text">Look</span>
            </div>
        </div>
        <div class="hint-actions">
            <div class="hint-group">
                <span class="hint-keys"><kbd>Shift</kbd></span>
                <span class="hint-text">Sprint</span>
            </div>
            <div class="hint-group">
                <span class="hint-keys"><kbd>Space</kbd></span>
                <span class="hint-text">Jump</span>
            </div>
            <div class="hint-group">
                <span class="hint-keys"><kbd>V</kbd></span>
                <span class="hint-text">Toggle View</span>
            </div>
            <div class="hint-group">
                <span class="hint-keys"><kbd>F</kbd></span>
                <span class="hint-text">Toggle Fly</span>
            </div>
        </div>
    </div>

    <a class="source" href="https://github.com/hh-hang/cesium-player-controller/blob/main/example/gltf/index.ts" target="_blank" rel="noopener noreferrer" aria-label="Source code">
        <img src="/imgs/source.svg" alt="" />
    </a>

    <script type="module" src="../control-hints.ts"></script>
    <script type="module" src="./index.ts"></script>
</body>
</html>
